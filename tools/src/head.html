<!DOCTYPE html>
<html lang="{{lang}}" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
{{alternates}}
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141111" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">
  <link rel="manifest" href="{{root}}site.webmanifest">
  <link rel="preload" href="{{root}}assets/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{root}}assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{root}}assets/css/style.css">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Watoto wa Nest e.V.">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{site_url}}assets/img/group-gate-1600.jpg">
  <meta property="og:locale" content="{{og_locale}}">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "NGO",
    "name": "Watoto wa Nest e.V.",
    "alternateName": "Förderverein des The Nest Children's Home",
    "url": "{{site_url}}",
    "logo": "{{site_url}}assets/img/logo-bird.svg",
    "email": "watotowanest@gmail.com",
    "telephone": "+49 176 93178582",
    "foundingDate": "2019",
    "nonprofitStatus": "NonprofitType",
    "address": { "@type": "PostalAddress", "streetAddress": "Trostberger Str. 35", "postalCode": "83342", "addressLocality": "Tacherting", "addressCountry": "DE" },
    "sameAs": ["https://www.instagram.com/watotowanest_/", "https://www.betterplace.org/de/projects/98900"]
  }
  </script>
</head>
<body>
<a class="skip-link" href="#main">{{skip}}</a>
